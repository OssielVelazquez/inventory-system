services:
  # ============================
  # PostgreSQL Database
  # ============================
  postgres:
    image: postgres:17-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CrudJava2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-network

  # ============================
  # Backend (Spring Boot)
  # ============================
  backend:
    build: ./inventory-api
    container_name: inventory-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USER: postgres
      DB_PASSWORD: CrudJava2026!
      JWT_SECRET: miClaveSecretaMuySeguraYCompleja1234567890ParaJWTTokenDe256Bits
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - inventory-network

  # ============================
  # Frontend (React + nginx)
  # ============================
  frontend:
    build: ./inventory-frontend
    container_name: inventory-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inventory-network

# ============================
# Volumes y Networks
# ============================
volumes:
  postgres_data:

networks:
  inventory-network:
    driver: bridge
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:CrudJava2026!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  jwt:
    secret: ${JWT_SECRET:miClaveSecretaMuySeguraYCompleja1234567890ParaJWTTokenDe256Bits}
    expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.kyoran.inventory_api: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
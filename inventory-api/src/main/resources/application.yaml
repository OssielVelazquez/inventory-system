spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres  # Cambia por tu usuario de PostgreSQL
    password: CrudJava2026!  # Cambia por tu contraseña de PostgreSQL
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql

  # Para permitir el acceso a H2 Console (opcional)
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081
  servlet:
    context-path: /

# JWT Configuration
app:
  jwt:
    secret: "miClaveSecretaMuySeguraYCompleja1234567890ParaJWTTokenDe256Bits"
    expiration: 86400000  # 24 horas en milisegundos

# Logging (opcional)
logging:
  level:
    com.kyoran.inventory_api: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE